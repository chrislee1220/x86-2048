name: Build OpenWrt x86_64

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v25.12.5
  CONFIG_FILE: .config
  DIY_SCRIPT: diy-script.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查项目
      uses: actions/checkout@v4

    # 新增: 缓存下载的软件包
    - name: 缓存 OpenWrt 下载
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-

    # 新增: 缓存工具链
    - name: 缓存构建工具链
      uses: actions/cache@v4
      with:
        path: |
          openwrt/build_dir/toolchain-*
          openwrt/staging_dir/toolchain-*
        key: ${{ runner.os }}-openwrt-toolchain-${{ hashFiles('.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-toolchain-

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
        libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
        libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
        python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
        clang llvm \
        uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        clang --version
        llc --version
        llvm-dis --version
        opt --version
        llvm-strip --version
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        set -Eeuo pipefail
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        git clone --depth=1 --branch main https://github.com/kenzok8/openwrt-daede.git daede-feed
        test -f daede-feed/daed/Makefile
        test -f daede-feed/luci-app-daede/Makefile
        printf 'src-link daede %s\n' "/workdir/daede-feed" >> openwrt/feeds.conf.default
        rm -rf "$GITHUB_WORKSPACE/openwrt"
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 更新和安装 feeds
      run: |
        set -Eeuo pipefail
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds uninstall daed || true
        ./scripts/feeds uninstall luci-app-daede || true
        ./scripts/feeds install -f -p daede daed luci-app-daede

    - name: 加载自定义配置
      run: |
        set -Eeuo pipefail
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_SCRIPT
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_SCRIPT

    - name: 下载软件包
      id: package
      run: |
        set -Eeuo pipefail
        cd openwrt
        make defconfig

        required_config=(
          'CONFIG_TARGET_x86_64=y'
          'CONFIG_TARGET_x86_64_DEVICE_generic=y'
          'CONFIG_TARGET_ROOTFS_PARTSIZE=2048'
          'CONFIG_DEVEL=y'
          'CONFIG_LUCI_LANG_zh_Hans=y'
          'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y'
          'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y'
          'CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y'
          'CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y'
          'CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y'
          'CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y'
          'CONFIG_PACKAGE_kmod-hwmon-coretemp=y'
          'CONFIG_PACKAGE_kmod-hwmon-core=y'
          'CONFIG_PACKAGE_luci-app-statistics=y'
          'CONFIG_PACKAGE_collectd=y'
          'CONFIG_PACKAGE_collectd-mod-cpu=y'
          'CONFIG_PACKAGE_collectd-mod-sensors=y'
          'CONFIG_PACKAGE_collectd-mod-thermal=y'
          'CONFIG_PACKAGE_ca-bundle=y'
          'CONFIG_PACKAGE_ca-certificates=y'
          'CONFIG_PACKAGE_libustream-openssl=y'
          'CONFIG_PACKAGE_wget-ssl=y'
          'CONFIG_PACKAGE_curl=y'
          'CONFIG_PACKAGE_bash=y'
          'CONFIG_PACKAGE_bind-dig=y'
          'CONFIG_PACKAGE_drill=y'
          'CONFIG_PACKAGE_jq=y'
          'CONFIG_PACKAGE_lsof=y'
          'CONFIG_PACKAGE_lsblk=y'
          'CONFIG_PACKAGE_nano=y'
          'CONFIG_PACKAGE_pciutils=y'
          'CONFIG_PACKAGE_smartmontools=y'
          'CONFIG_PACKAGE_usbutils=y'
          'CONFIG_PACKAGE_daed=y'
          'CONFIG_PACKAGE_luci-app-daede=y'
          'CONFIG_PACKAGE_luci-app-daede_daed=y'
          'CONFIG_PACKAGE_kmod-tun=y'
          'CONFIG_PACKAGE_kmod-sched-core=y'
          'CONFIG_PACKAGE_kmod-sched-bpf=y'
          'CONFIG_PACKAGE_kmod-veth=y'
          'CONFIG_PACKAGE_v2ray-geoip=y'
          'CONFIG_PACKAGE_v2ray-geosite=y'
          'CONFIG_BPF_TOOLCHAIN_HOST=y'
          'CONFIG_USE_LLVM_HOST=y'
        )
        for item in "${required_config[@]}"; do
          grep -Fxq "$item" .config || {
            echo "ERROR: required package/config was not selected after defconfig: $item" >&2
            exit 1
          }
        done

        for tool in clang llc llvm-dis opt llvm-strip; do
          command -v "$tool" >/dev/null || {
            echo "ERROR: required LLVM/BPF build tool is missing: $tool" >&2
            exit 1
          }
        done
        clang_major="$(clang --target=bpfel -dM -E - < /dev/null | awk '/__clang_major__/ {print $3; exit}')"
        [ "${clang_major:-0}" -ge 12 ] || {
          echo "ERROR: LLVM/clang version too old for OpenWrt BPF build. Minimum required: 12, found: ${clang_major:-unknown}" >&2
          exit 1
        }

        grep -E 'CONFIG_(DEVEL|USE_LLVM_HOST|BPF_TOOLCHAIN_HOST|PACKAGE_daed|PACKAGE_luci-app-daede|PACKAGE_vmlinux-btf|DAED_USE_|KERNEL_(DEBUG_INFO_BTF|XDP_SOCKETS|BPF|BPF_SYSCALL|BPF_JIT))' .config || true
        grep -Eq '^(CONFIG_DAED_USE_KERNEL_BTF|CONFIG_DAED_USE_VMLINUX_BTF)=y$' .config || {
          echo "ERROR: daed BTF source was not selected after defconfig" >&2
          exit 1
        }

        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        set -Eeuo pipefail
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        manifest="$(find bin/targets/x86/64 -maxdepth 1 -type f -name '*.manifest' | head -n 1)"
        test -n "$manifest"
        for package in \
          daed \
          luci-app-daede \
          luci-i18n-base-zh-cn \
          luci-i18n-firewall-zh-cn \
          luci-i18n-package-manager-zh-cn \
          luci-i18n-ddns-zh-cn \
          luci-i18n-upnp-zh-cn \
          luci-i18n-statistics-zh-cn \
          kmod-hwmon-coretemp \
          kmod-hwmon-core \
          luci-app-statistics \
          collectd \
          collectd-mod-cpu \
          collectd-mod-sensors \
          collectd-mod-thermal \
          ca-bundle \
          ca-certificates \
          libustream-openssl \
          wget-ssl \
          curl \
          bash \
          bind-dig \
          drill \
          jq \
          lsof \
          lsblk \
          nano \
          pciutils \
          smartmontools \
          usbutils \
          kmod-tun \
          kmod-sched-core \
          kmod-sched-bpf \
          kmod-veth \
          v2ray-geoip \
          v2ray-geosite; do
          grep -Eq "(^|[[:space:]])${package}([[:space:]]|$)" "$manifest" || {
            echo "ERROR: final firmware manifest is missing: $package" >&2
            exit 1
          }
        done
        echo "Final manifest verified: $manifest"

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    # 新增: 上传编译日志
    - name: 上传编译日志
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: |
          openwrt/logs/
          openwrt/.config

    - name: 上传 bin 目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理文件
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
